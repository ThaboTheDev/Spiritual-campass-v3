name: Dart and Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.0
          channel: stable
          cache: true

      - name: Resolve Pub workspace
        working-directory: apps/app
        run: flutter pub get

      - name: Analyze shared core
        run: dart analyze packages/core

      - name: Test shared core
        working-directory: packages/core
        run: dart test

      - name: Analyze API
        run: dart analyze apps/api

      - name: Test API
        working-directory: apps/api
        run: dart test

      - name: Analyze Flutter app
        working-directory: apps/app
        run: flutter analyze

      - name: Test Flutter app
        working-directory: apps/app
        run: flutter test
